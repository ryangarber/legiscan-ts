name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Generate types
        run: pnpm typegen

      - name: Lint and typecheck
        run: pnpm check

      - name: Test
        run: pnpm test --run

      - name: Build
        run: pnpm build
