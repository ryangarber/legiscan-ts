name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'trusted' || 'untrusted' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Generate types
        run: pnpm typegen

      - name: Format and lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Tests that call the API skip themselves when no key is set.
      - name: Test
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: pnpm test --run

      - name: Build
        run: pnpm build
