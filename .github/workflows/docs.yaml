name: docs
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    # typedoc doesn't support typescript 7 yet. the api is not likely to change
    # in the near future, so the docs will remain accurate and we can just wait
    # for a proper typedoc update
    if: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Build docs
        run: |
          pnpm run build
          pnpm exec typedoc
          touch docs/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'
          include-hidden-files: 'true'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
